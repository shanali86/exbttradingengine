<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>EXBEAST Token Dashboard</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <link rel="icon" href="favicon.ico" sizes="any">
  <link rel="icon" href="brand/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="brand/apple-touch-icon.png">
  <link rel="manifest" href="brand/site.webmanifest">
  <meta name="theme-color" content="#0A0A0A">
  <script>
    // Apply the saved light/dark choice before first paint (ThemeService takes over after boot).
    (function () {
      var pref = 'system';
      try { pref = localStorage.getItem('exbeast-theme') || 'system'; } catch (e) {}
      var dark = pref === 'dark' || (pref !== 'light' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
      document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
  <app-root></app-root>
</body>
</html>
